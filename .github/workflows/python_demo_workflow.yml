name: Python PR check

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' # Specify your desired Python version

    #- name: Install dependencies
     # run: pip install -r requirements.txt # If you have a requirements.txt file

    - name: Print Demo Github Action
      run: echo "Simple Demo of GitHub Actions!" 
      
    
